<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — ResaCoiff</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { background:#0f0f0f; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-box { background:var(--blanc); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.5); padding:48px 40px; width:100%; max-width:420px; }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo a { font-size:28px; font-weight:800; color:var(--noir); }
    .login-logo a span { color:var(--or); }
    .login-logo .tag { display:inline-block; background:#f3f4f6; color:var(--gris); font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; margin-top:6px; letter-spacing:1px; text-transform:uppercase; }
    h1 { font-size:22px; font-weight:700; margin-bottom:24px; }
    .btn { width:100%; margin-top:4px; }
  </style>
</head>
<body>
<div class="login-box fade-in">
  <div class="login-logo">
    <a href="/">Resa<span>Coiff</span></a>
    <div class="tag">Administration</div>
  </div>
  <h1>Connexion Admin</h1>
  <div id="error" class="alert alert-error" style="display:none"></div>
  <form id="form-login">
    <div class="form-group"><label>Email</label><input type="email" id="email" required placeholder="admin@resacoiff.fr" autofocus></div>
    <div class="form-group"><label>Mot de passe</label><input type="password" id="mot_de_passe" required placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"></div>
    <button type="submit" class="btn btn-noir btn-lg" id="btn-login">Se connecter</button>
  </form>
</div>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-login'), err = document.getElementById('error');
  err.style.display = 'none'; btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;
  const res = await fetch('/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email:document.getElementById('email').value, mot_de_passe:document.getElementById('mot_de_passe').value }) });
  const data = await res.json();
  if (data.error) { err.textContent = data.error; err.style.display = 'block'; btn.innerHTML = 'Se connecter'; btn.disabled = false; }
  else window.location.href = '/admin';
});
</script>
</body>
</html>
